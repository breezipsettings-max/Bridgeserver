<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUSTER SYNC ENGINE AI TERMINAL</title>
    <!-- Marked JS for robust markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #080a0f;
            --panel-bg: #0f1319;
            --terminal-bg: #040609;
            --accent-green: #00ff66;
            --accent-cyan: #00e5ff;
            --text-dim: #6b7c93;
            --text-bright: #e2e8f0;
            --border-color: #1a222d;
            --code-bg: #020305;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-bright);
            font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .terminal-container {
            width: 100%;
            max-width: 1050px;
            height: 92vh;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 20px rgba(0,255,102,0.04);
            display: flex;
            flex-direction: column;
            padding: 20px;
            margin: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 {
            font-size: 1.15rem;
            letter-spacing: 2px;
            color: var(--accent-green);
            margin: 0;
            text-shadow: 0 0 10px rgba(0,255,102,0.3);
        }

        #status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff3333;
            box-shadow: 0 0 8px #ff3333;
            transition: all 0.3s ease;
        }

        #status.online {
            background: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
        }

        .header-box {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            margin-bottom: 15px;
            font-size: 11px;
            color: var(--text-dim);
            border-radius: 6px;
            line-height: 1.6;
        }

        .header-box span {
            color: var(--accent-cyan);
        }

        #terminal {
            flex: 1;
            background: var(--terminal-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow-y: auto;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.9);
        }

        /* Custom Modern Scrollbar */
        #terminal::-webkit-scrollbar {
            width: 6px;
        }
        #terminal::-webkit-scrollbar-track {
            background: var(--terminal-bg);
        }
        #terminal::-webkit-scrollbar-thumb {
            background: #1a222d;
            border-radius: 3px;
        }
        #terminal::-webkit-scrollbar-thumb:hover {
            background: var(--accent-green);
        }

        .message {
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .system {
            color: var(--text-dim);
            font-style: italic;
        }

        .user-msg {
            color: var(--accent-cyan);
            font-weight: 600;
        }

        .ai-msg {
            color: var(--text-bright);
        }

        .ai-msg strong {
            color: var(--accent-green);
        }

        .ai-msg p {
            margin: 6px 0;
        }

        .ai-msg ul, .ai-msg ol {
            margin: 8px 0;
            padding-left: 22px;
            color: #d1d5db;
        }

        .ai-msg li {
            margin-bottom: 5px;
        }

        /* Clean code box formatting with copy button */
        .code-box {
            position: relative;
            background: var(--code-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin: 12px 0;
            padding: 14px;
            overflow-x: auto;
        }

        .code-box pre {
            margin: 0;
            color: var(--accent-green);
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #11161d;
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            font-size: 10px;
            padding: 4px 9px;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: var(--accent-green);
            color: #000;
        }

        .input-cluster {
            display: flex;
            gap: 12px;
        }

        input {
            background: var(--terminal-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--accent-green);
            flex: 1;
            padding: 14px 16px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 10px rgba(0,255,102,0.15);
        }

        button.send-btn {
            background: var(--accent-green);
            color: #000;
            border: none;
            border-radius: 6px;
            padding: 0 28px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            letter-spacing: 1px;
            transition: opacity 0.2s, transform 0.1s;
        }

        button.send-btn:hover {
            opacity: 0.9;
        }

        button.send-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="terminal-container">
        <div class="header">
            <div class="title-group">
                <div id="status"></div>
                <h1>CLUSTER SYNC ENGINE AI</h1>
            </div>
        </div>
        
        <div class="header-box">
            <strong>Architecture Active:</strong> <span>State Synchronization</span> active | 
            <span>Vector & Embedding Distribution</span> synced | 
            <span>Orchestration Bypasses</span> operational (WebSocket/REST Hybrid)
        </div>

        <div id="terminal" class="system">System: Initializing Cluster Sync terminal stream... (Press '/' to focus input)</div>
        
        <div class="input-cluster">
            <input type="text" id="chat-input" placeholder="Type a prompt or code request..." onkeypress="handleKey(event)">
            <button class="send-btn" onclick="sendMessage()">TRANSMIT</button>
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const statusIndicator = document.getElementById('status');
        const chatInput = document.getElementById('chat-input');
        
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}`;
        let socket;

        // Auto-capture '/' key to focus input anywhere
        window.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== chatInput) {
                e.preventDefault();
                chatInput.focus();
            }
        });

        function connectWebSocket() {
            logMessage('System: Establishing secure WebSocket tunnel...', 'system');
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                logMessage('System: Cluster node link established successfully.', 'system');
                statusIndicator.classList.add('online');
            };

            socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.result) {
                        renderFormattedMessage(data.result, 'ai-msg');
                    } else if (data.error) {
                        logMessage("Cluster Error: " + data.error, 'system');
                    }
                } catch (e) {
                    logMessage("System: Raw sync stream -> " + event.data, 'system');
                }
            };

            socket.onerror = () => {
                logMessage('System Warning: WebSocket tunnel disruption detected.', 'system');
            };

            socket.onclose = () => {
                logMessage('System: Connection dropped. Reconnecting cluster sync in 5s...', 'system');
                statusIndicator.classList.remove('online');
                setTimeout(connectWebSocket, 5000);
            };
        }

        function logMessage(text, className) {
            const div = document.createElement('div');
            div.className = 'message ' + className;
            div.textContent = text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function renderFormattedMessage(markdownText, className) {
            const div = document.createElement('div');
            div.className = 'message ' + className;

            const prefix = document.createElement('strong');
            prefix.style.color = 'var(--accent-green)';
            prefix.textContent = 'AI NODE: ';
            div.appendChild(prefix);

            const contentDiv = document.createElement('div');
            contentDiv.style.display = 'inline-block';
            contentDiv.style.width = '100%';

            // Parse markdown cleanly via Marked.js
            contentDiv.innerHTML = marked.parse(markdownText);

            // Wrap code blocks with interactive COPY buttons
            const codeBlocks = contentDiv.querySelectorAll('pre');
            codeBlocks.forEach(pre => {
                const box = document.createElement('div');
                box.className = 'code-box';
                pre.parentNode.insertBefore(box, pre);
                box.appendChild(pre);

                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.textContent = 'COPY';
                btn.onclick = () => {
                    navigator.clipboard.writeText(pre.textContent);
                    btn.textContent = 'COPIED!';
                    setTimeout(() => btn.textContent = 'COPY', 2000);
                };
                box.appendChild(btn);
            });

            div.appendChild(contentDiv);
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function handleKey(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            const promptText = chatInput.value.trim();
            if (!promptText) return;

            logMessage("ADMIN: " + promptText, 'user-msg');
            chatInput.value = '';

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ prompt: promptText }));
            } else {
                fetch('/api/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptText })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        renderFormattedMessage(data.result, 'ai-msg');
                    } else {
                        logMessage("Cluster Error: " + (data.error || 'Unknown error'), 'system');
                    }
                })
                .catch(() => {
                    logMessage("System Error: Failed to reach backend cluster node.", 'system');
                });
            }
        }

        connectWebSocket();
    </script>
</body>
</html>
