<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUSTER SYNC ENGINE AI TERMINAL</title>
    <!-- Marked JS for clean markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #080a0f;
            --panel-bg: #0f1319;
            --terminal-bg: #040609;
            --accent-green: #00ff66;
            --accent-cyan: #00e5ff;
            --text-dim: #6b7c93;
            --text-bright: #e2e8f0;
            --border-color: #1a222d;
            --code-bg: #020305;
            --sidebar-width: 220px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-bright);
            font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-layout {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 92vh;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 20px rgba(0,255,102,0.04);
            display: flex;
            margin: 20px;
            overflow: hidden;
        }

        /* Left Sidebar for Tabs & Settings */
        .sidebar {
            width: var(--sidebar-width);
            background: #0a0d12;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 15px 10px;
        }

        .sidebar-top-cluster {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .new-chat-btn {
            flex: 1;
            background: transparent;
            color: var(--accent-green);
            border: 1px dashed var(--accent-green);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .new-chat-btn:hover {
            background: var(--accent-green);
            color: #000;
        }

        .tab-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .tab-item {
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--text-dim);
            cursor: pointer;
            border: 1px solid transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s;
        }

        .tab-item:hover {
            background: rgba(255,255,255,0.03);
            color: var(--text-bright);
        }

        .tab-item.active {
            background: var(--terminal-bg);
            color: var(--accent-cyan);
            border-color: var(--border-color);
            border-left: 3px solid var(--accent-cyan);
        }

        /* Sidebar Bottom Settings Button Placement */
        .sidebar-bottom {
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
            margin-top: 10px;
        }

        .settings-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            width: 100%;
            height: 42px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--text-dim);
            font-family: inherit;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .settings-btn:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
            background: rgba(0,255,102,0.05);
        }

        .settings-btn img {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        /* Right Terminal Area */
        .terminal-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            background: var(--panel-bg);
            position: relative;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 {
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            color: var(--accent-green);
            margin: 0;
            text-shadow: 0 0 10px rgba(0,255,102,0.3);
        }

        #status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff3333;
            box-shadow: 0 0 8px #ff3333;
            transition: all 0.3s ease;
        }

        #status.online {
            background: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
        }

        .header-box {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            margin-bottom: 12px;
            font-size: 11px;
            color: var(--text-dim);
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-box span { color: var(--accent-cyan); }
        #cluster-state { color: var(--accent-green); font-weight: bold; }

        #terminal {
            flex: 1;
            background: var(--terminal-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow-y: auto;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.9);
        }

        /* Custom Scrollbar */
        #terminal::-webkit-scrollbar { width: 6px; }
        #terminal::-webkit-scrollbar-track { background: var(--terminal-bg); }
        #terminal::-webkit-scrollbar-thumb { background: #1a222d; border-radius: 3px; }
        #terminal::-webkit-scrollbar-thumb:hover { background: var(--accent-green); }

        .message {
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            font-size: 0.88rem;
            line-height: 1.6;
        }

        .system { color: var(--text-dim); font-style: italic; }
        .user-msg { color: var(--accent-cyan); font-weight: 600; }
        .ai-msg { color: var(--text-bright); }
        .ai-msg strong { color: var(--accent-green); }

        /* Pure CSS Glowing Loading Spinner Node */
        .loading-node {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--accent-green);
            font-style: italic;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        .spinner-dot {
            width: 14px;
            height: 14px;
            border: 2px solid var(--accent-green);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin-glow 0.8s linear infinite;
            box-shadow: 0 0 8px var(--accent-green);
        }

        @keyframes spin-glow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Code box formatting with COPY button */
        .code-box {
            position: relative;
            background: var(--code-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin: 12px 0;
            padding: 14px;
            overflow-x: auto;
        }

        .code-box pre {
            margin: 0;
            color: var(--accent-green);
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #11161d;
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            font-size: 10px;
            padding: 4px 9px;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .copy-btn:hover { background: var(--accent-green); color: #000; }

        /* Input Cluster & Plus Button */
        .input-cluster { 
            display: flex; 
            gap: 10px; 
            position: relative;
        }

        .plus-btn {
            background: var(--terminal-bg);
            color: var(--accent-green);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            width: 48px;
            cursor: pointer;
            font-size: 1.3rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .plus-btn:hover {
            border-color: var(--accent-green);
            background: rgba(0,255,102,0.05);
        }

        input[type="text"] {
            background: var(--terminal-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--accent-green);
            flex: 1;
            padding: 14px 16px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 10px rgba(0,255,102,0.15);
        }

        button.send-btn {
            background: var(--accent-green);
            color: #000;
            border: none;
            border-radius: 6px;
            padding: 0 28px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            letter-spacing: 1px;
            transition: opacity 0.2s, transform 0.1s;
        }

        button.send-btn:hover { opacity: 0.9; }
        button.send-btn:active { transform: scale(0.98); }

        /* Drag & Drop Circle Overlay */
        #drop-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 10, 15, 0.85);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #drop-overlay.active {
            display: flex;
        }

        .drop-circle-box {
            width: 320px;
            height: 320px;
            border: 3px dashed var(--accent-green);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,255,102,0.2);
            animation: pulse-ring 2s infinite;
            background: rgba(4, 6, 9, 0.7);
            color: var(--accent-green);
            padding: 20px;
        }

        .drop-circle-box h3 {
            margin: 0 0 8px 0;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .drop-circle-box p {
            margin: 0;
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 102, 0.3); }
            70% { box-shadow: 0 0 0 25px rgba(0, 255, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 102, 0); }
        }

        /* Settings Modal Overlay */
        #settings-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 10, 15, 0.9);
            backdrop-filter: blur(6px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
        }

        #settings-modal.active {
            display: flex;
        }

        .modal-box {
            background: #0f1319;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 400px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .modal-header h3 {
            margin: 0;
            color: var(--accent-green);
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .close-modal {
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 1.2rem;
        }

        .close-modal:hover { color: var(--text-bright); }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .export-btn {
            background: var(--terminal-bg);
            color: var(--accent-cyan);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.85rem;
            text-align: left;
            transition: all 0.2s;
        }

        .export-btn:hover {
            border-color: var(--accent-cyan);
            background: rgba(0,229,255,0.05);
        }

        /* Hidden File Input */
        #file-selector {
            display: none;
        }
    </style>
</head>
<body>
    <div class="main-layout" id="main-layout">
        <!-- Settings Modal -->
        <div id="settings-modal">
            <div class="modal-box">
                <div class="modal-header">
                    <h3>[ CLUSTER CONFIGURATION ]</h3>
                    <button class="close-modal" onclick="toggleSettings(false)">×</button>
                </div>
                <div class="modal-body">
                    <p style="font-size: 0.8rem; color: var(--text-dim); margin-top: 0;">Manage terminal telemetry and session archives.</p>
                    <button class="export-btn" onclick="exportChatMarkdown()">📥 Export Active Chat (Markdown)</button>
                </div>
            </div>
        </div>

        <!-- Sidebar for Chat Tabs -->
        <div class="sidebar">
            <div class="sidebar-top-cluster">
                <button class="new-chat-btn" onclick="createNewTab()">+ NEW CHAT</button>
            </div>
            <div class="tab-list" id="tab-list">
                <!-- Dynamic tabs append here -->
            </div>
            <div class="sidebar-bottom">
                <button class="settings-btn" onclick="toggleSettings(true)" title="Settings">
                    <img src="assets/Settings.png" alt="Settings">
                    <span>SETTINGS</span>
                </button>
            </div>
        </div>

        <!-- Terminal Main Area -->
        <div class="terminal-container" id="terminal-container">
            <!-- Drag and Drop Overlay Circle -->
            <div id="drop-overlay">
                <div class="drop-circle-box">
                    <h3>[ DROP FILES HERE ]</h3>
                    <p>Release to scan and transmit content to AI node</p>
                </div>
            </div>

            <div class="header">
                <div class="title-group">
                    <div id="status"></div>
                    <h1>CLUSTER SYNC ENGINE AI</h1>
                </div>
            </div>
            
            <div class="header-box">
                <div>
                    <strong>Architecture Active:</strong> <span>State Synchronization</span> active | 
                    <span>Vector & Embedding Distribution</span> synced
                </div>
                <div id="cluster-state">CLUSTER: ACTIVE</div>
            </div>

            <div id="terminal"></div>
            
            <div class="input-cluster">
                <input type="file" id="file-selector" multiple onchange="handleFileSelect(event)">
                <button class="plus-btn" onclick="document.getElementById('file-selector').click()" title="Upload Files">+</button>
                <input type="text" id="chat-input" placeholder="Type a prompt or code request..." onkeypress="handleKey(event)">
                <button class="send-btn" onclick="sendMessage()">TRANSMIT</button>
            </div>
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const statusIndicator = document.getElementById('status');
        const chatInput = document.getElementById('chat-input');
        const clusterState = document.getElementById('cluster-state');
        const tabList = document.getElementById('tab-list');
        const mainLayout = document.getElementById('main-layout');
        const dropOverlay = document.getElementById('drop-overlay');
        const settingsModal = document.getElementById('settings-modal');

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}`;
        let socket;

        // Session Memory & Tabs State
        let tabs = [];
        let activeTabId = null;
        const MAX_RENDERED_DOM_NODES = 25;

        function createNewTab(title = 'New Session') {
            const tabId = 'tab_' + Date.now();
            const newTab = { id: tabId, title, messages: [] };
            tabs.push(newTab);
            setActiveTab(tabId);
            renderTabs();
        }

        function setActiveTab(tabId) {
            activeTabId = tabId;
            renderTabs();
            renderActiveTerminal();
        }

        function renderTabs() {
            tabList.innerHTML = '';
            tabs.forEach(t => {
                const div = document.createElement('div');
                div.className = `tab-item ${t.id === activeTabId ? 'active' : ''}`;
                div.textContent = t.title;
                div.onclick = () => setActiveTab(t.id);
                tabList.appendChild(div);
            });
        }

        function getActiveTab() {
            return tabs.find(t => t.id === activeTabId);
        }

        function toggleSettings(open) {
            if (open) {
                settingsModal.classList.add('active');
            } else {
                settingsModal.classList.remove('active');
            }
        }

        function exportChatMarkdown() {
            const currentTab = getActiveTab();
            if (!currentTab || currentTab.messages.length === 0) {
                alert('No messages in active session to export.');
                return;
            }

            let mdContent = `# Cluster Sync Engine AI - ${currentTab.title}\n\n`;
            currentTab.messages.forEach(msg => {
                if (msg.type === 'system') {
                    mdContent += `> *${msg.content}*\n\n`;
                } else if (msg.type === 'user') {
                    mdContent += `**ADMIN:** ${msg.content}\n\n`;
                } else if (msg.type === 'ai') {
                    mdContent += `**AI NODE:**\n${msg.content}\n\n---\n\n`;
                }
            });

            const blob = new Blob([mdContent], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${currentTab.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_export.md`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            toggleSettings(false);
        }

        // Auto-capture '/' key focus
        window.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== chatInput) {
                e.preventDefault();
                chatInput.focus();
            }
        });

        // Drag and Drop File Handlers
        let dragCounter = 0;

        mainLayout.addEventListener('dragenter', (e) => {
            e.preventDefault();
            dragCounter++;
            dropOverlay.classList.add('active');
        });

        mainLayout.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dragCounter--;
            if (dragCounter === 0) {
                dropOverlay.classList.remove('active');
            }
        });

        mainLayout.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        mainLayout.addEventListener('drop', (e) => {
            e.preventDefault();
            dragCounter = 0;
            dropOverlay.classList.remove('active');

            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                processFiles(e.dataTransfer.files);
            }
        });

        function handleFileSelect(event) {
            if (event.target.files && event.target.files.length > 0) {
                processFiles(event.target.files);
                event.target.value = '';
            }
        }

        function processFiles(files) {
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                logSystemMessage(`System: Scanning file payload -> [${file.name}] (${(file.size/1024).toFixed(1)} KB)...`);
                
                reader.onload = (e) => {
                    const content = e.target.result;
                    const scanPrompt = `Analyze and scan the following attached file contents from [${file.name}]:\n\n\`\`\`\n${content}\n\`\`\``;
                    
                    const currentTab = getActiveTab();
                    if (currentTab) {
                        currentTab.messages.push({ type: 'user', content: `UPLOAD FILE: ${file.name}` });
                        renderActiveTerminal();
                        showLoadingIndicator();

                        if (socket && socket.readyState === WebSocket.OPEN) {
                            socket.send(JSON.stringify({ prompt: scanPrompt }));
                        } else {
                            fetch('/api/ask', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ prompt: scanPrompt })
                            })
                            .then(res => res.json())
                            .then(data => {
                                removeLoadingIndicator();
                                if (data.success) {
                                    renderFormattedMessage(data.result, 'ai-msg');
                                } else {
                                    logSystemMessage("Cluster Error: " + (data.error || 'Scan failed'));
                                }
                            })
                            .catch(() => {
                                removeLoadingIndicator();
                                logSystemMessage("System Error: Failed to transmit scanned file stream.");
                            });
                        }
                    }
                };

                if (file.type.startsWith('image/')) {
                    reader.readAsDataURL(file);
                } else {
                    reader.readAsText(file);
                }
            });
        }

        function connectWebSocket() {
            logSystemMessage('System: Establishing secure WebSocket tunnel...');
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                logSystemMessage('System: Cluster node link established successfully.');
                statusIndicator.classList.add('online');
                clusterState.textContent = 'CLUSTER: ONLINE (1-10 ROTATION)';
            };

            socket.onmessage = (event) => {
                removeLoadingIndicator();
                try {
                    const data = JSON.parse(event.data);
                    if (data.result) {
                        renderFormattedMessage(data.result, 'ai-msg');
                    } else if (data.systemInfo) {
                        logSystemMessage("System Notice: " + data.systemInfo);
                        clusterState.textContent = 'CLUSTER: IDLE (SAVING TOKENS)';
                    } else if (data.error) {
                        logSystemMessage("Cluster Error: " + data.error);
                    }
                } catch (e) {
                    logSystemMessage("System: Raw sync stream -> " + event.data);
                }
            };

            socket.onerror = () => {
                removeLoadingIndicator();
                logSystemMessage('System Warning: WebSocket tunnel disruption detected.');
            };

            socket.onclose = () => {
                removeLoadingIndicator();
                logSystemMessage('System: Connection dropped. Reconnecting in 5s...');
                statusIndicator.classList.remove('online');
                clusterState.textContent = 'CLUSTER: RECONNECTING';
                setTimeout(connectWebSocket, 5000);
            };
        }

        function showLoadingIndicator() {
            removeLoadingIndicator();
            const div = document.createElement('div');
            div.id = 'loading-node';
            div.className = 'loading-node';
            div.innerHTML = `
                <div class="spinner-dot"></div>
                <span>[AI NODE PROCESSING STREAM...]</span>
            `;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function removeLoadingIndicator() {
            const el = document.getElementById('loading-node');
            if (el) el.remove();
        }

        function logSystemMessage(text) {
            const currentTab = getActiveTab();
            if (currentTab) {
                currentTab.messages.push({ type: 'system', content: text });
                renderActiveTerminal();
            }
        }

        function renderActiveTerminal() {
            terminal.innerHTML = '';
            const currentTab = getActiveTab();
            if (!currentTab) return;

            const visibleMessages = currentTab.messages.slice(-MAX_RENDERED_DOM_NODES);

            visibleMessages.forEach(msg => {
                if (msg.type === 'system') {
                    const div = document.createElement('div');
                    div.className = 'message system';
                    div.textContent = msg.content;
                    terminal.appendChild(div);
                } else if (msg.type === 'user') {
                    const div = document.createElement('div');
                    div.className = 'message user-msg';
                    div.textContent = "ADMIN: " + msg.content;
                    terminal.appendChild(div);
                } else if (msg.type === 'ai') {
                    const div = document.createElement('div');
                    div.className = 'message ai-msg';

                    const prefix = document.createElement('strong');
                    prefix.style.color = 'var(--accent-green)';
                    prefix.textContent = 'AI NODE: ';
                    div.appendChild(prefix);

                    const contentDiv = document.createElement('div');
                    contentDiv.style.display = 'inline-block';
                    contentDiv.style.width = '100%';
                    contentDiv.innerHTML = marked.parse(msg.content);

                    const codeBlocks = contentDiv.querySelectorAll('pre');
                    codeBlocks.forEach(pre => {
                        const box = document.createElement('div');
                        box.className = 'code-box';
                        pre.parentNode.insertBefore(box, pre);
                        box.appendChild(pre);

                        const btn = document.createElement('button');
                        btn.className = 'copy-btn';
                        btn.textContent = 'COPY';
                        btn.onclick = () => {
                            navigator.clipboard.writeText(pre.textContent);
                            btn.textContent = 'COPIED!';
                            setTimeout(() => btn.textContent = 'COPY', 2000);
                        };
                        box.appendChild(btn);
                    });

                    div.appendChild(contentDiv);
                    terminal.appendChild(div);
                }
            });

            terminal.scrollTop = terminal.scrollHeight;
        }

        function renderFormattedMessage(markdownText, className) {
            const currentTab = getActiveTab();
            if (currentTab) {
                currentTab.messages.push({ type: 'ai', content: markdownText });
                renderActiveTerminal();
                clusterState.textContent = 'CLUSTER: ACTIVE';
            }
        }

        function handleKey(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            const promptText = chatInput.value.trim();
            if (!promptText) return;

            const currentTab = getActiveTab();
            if (!currentTab) return;

            if (currentTab.messages.length <= 1 && currentTab.title === 'New Session') {
                currentTab.title = promptText.slice(0, 20) + '...';
                renderTabs();
            }

            currentTab.messages.push({ type: 'user', content: promptText });
            renderActiveTerminal();
            chatInput.value = '';

            showLoadingIndicator();

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ prompt: promptText }));
            } else {
                fetch('/api/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptText })
                })
                .then(res => res.json())
                .then(data => {
                    removeLoadingIndicator();
                    if (data.success) {
                        renderFormattedMessage(data.result, 'ai-msg');
                    } else {
                        logSystemMessage("Cluster Error: " + (data.error || 'Unknown error'));
                    }
                })
                .catch(() => {
                    removeLoadingIndicator();
                    logSystemMessage("System Error: Failed to reach backend cluster node.");
                });
            }
        }

        // Initialize default tab and WebSocket
        createNewTab('Main Cluster Session');
        connectWebSocket();
    </script>
</body>
</html>
